[project]
name = "gw2arcupd"
version = "0.1.0"
description = "Terminal UI for updating the arcdps addon for Guild Wars 2"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.71",
    "httpx>=0.27",
]

[tool.uv]
# uv will generate a lock file automatically

[project.scripts]
gw2upd = "gw2upd.main:run"